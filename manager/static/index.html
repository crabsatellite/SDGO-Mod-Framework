<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDGO Mod Manager · 更新与管理</title>
<link rel="icon" href="/brand.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48 256x256">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="manager-shell">
  <aside class="manager-nav" data-ui-art="plating">
    <a class="brand" href="/" data-ui-mark><span class="brand-text"><b>SDGO</b><span>MOD HANGAR</span></span></a>
    <div class="mode-badge"><i class="ui-led is-on"></i><span id="mode-label">开发信息已展开</span></div>
    <nav class="nav-groups">
      <div class="ui-nav-label">游戏</div>
      <button class="nav-item ui-nav-item selected" id="nav-mods" data-ui-icon="mods">游戏功能</button>
      <button class="nav-item ui-nav-item" id="nav-archive" data-ui-icon="archive">修复归档</button>
      <div id="owner-group">
        <div class="ui-nav-label owner-label"><span>服主工具</span><button id="owner-hide" class="owner-link" type="button">收起</button></div>
        <div id="provider-nav"></div>
        <button class="nav-item ui-nav-item" id="nav-services" data-ui-icon="services">后台任务</button>
      </div>
      <button id="owner-show" class="owner-link owner-show" type="button">我是服主：显示服主工具</button>
    </nav>
    <div class="nav-bottom">
      <button id="nav-updates" class="ui-btn is-blue is-small" data-ui-icon="download">更新</button>
      <button id="change-mode" class="ui-btn is-ghost is-small" data-ui-icon="developer">显示开发信息</button>
      <a id="ui-kit-link" class="ui-btn is-ghost is-small" href="/ui-kit.html" target="_blank" rel="noopener" data-ui-icon="settings" hidden>UI 组件库</a>
      <button id="exit-manager" class="ui-btn is-ghost is-small" data-ui-icon="exit">退出管理器</button>
      <small>游戏仍使用原来的启动方式</small>
    </div>
  </aside>
  <div class="manager-main ui-auto">
    <header class="manager-header">
      <div class="header-copy">
        <small class="eyebrow ui-eyebrow" id="eyebrow">你的单机版</small>
        <h1 id="page-title" class="ui-title">我的 Mod</h1>
      </div>
      <div class="host-tools">
        <span class="host-label" data-ui-icon="host">管理对象</span>
        <select id="host-select" class="ui-select" aria-label="选择客户端或服务器"></select>
        <button id="add-host" class="ui-btn is-blue" data-ui-icon="add" title="添加游戏客户端或服务器目录">添加目录</button>
      </div>
    </header>
    <section class="owner-notice" aria-labelledby="owner-notice-title">
      <div><strong id="owner-notice-title">客户端更新与服主管理</strong>
      <p>玩家可以在此更新完整客户端，游戏仍从原来的入口启动。共享 Mod 和内容配置由服主维护；需要自行调整时，请先明确接管维护方式。</p></div>
      <button id="create-entrypoints" class="ui-btn is-ghost is-small" type="button">创建目录入口</button>
    </section>
    <nav id="page-index" class="page-index" aria-label="本页内容" hidden></nav>
    <main id="content"></main>
    <div id="manager-message" class="ui-log" role="status" aria-live="polite"><span id="manager-message-text"></span><button id="manager-message-close" class="toast-close" type="button" aria-label="关闭提示">×</button></div>
    <button id="to-top" class="ui-btn is-ghost is-small to-top" type="button" hidden>回到顶部</button>
  </div>
</div>
<dialog id="path-dialog" class="ui-dialog">
  <form method="dialog">
    <span class="ui-eyebrow">TARGET HOST</span>
    <h2 id="path-title">添加客户端</h2>
    <p class="ui-muted">选择含有游戏 EXE 的目录。配置只保存在本机。</p>
    <label class="ui-field"><span>目录路径</span><input id="host-path" class="ui-input" placeholder="D:\Games\SDGO" required></label>
    <div class="dialog-actions ui-dialog-actions">
      <button value="cancel" class="ui-btn is-ghost">取消</button>
      <button id="confirm-host" value="default" class="ui-btn is-primary">添加</button>
    </div>
  </form>
</dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
