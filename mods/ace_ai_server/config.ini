[settings]
; 0 disables Ace selection for that room difficulty.
AceChanceEasy=5
AceChanceMedium=5
AceChanceHard=5
; The effective AI profile of an Ace selected from each base difficulty.
AceDifficultyEasy=Medium
AceDifficultyMedium=Hard
AceDifficultyHard=Hard
; Applied once to every unit in that Ace pilot's deck. Hard defaults to 1.2x HP.
AceHpPercentEasy=100
AceHpPercentMedium=100
AceHpPercentHard=120
; Ordinary weapon damage only; specials keep the native rule.
AceAttackPercentEasy=100
AceAttackPercentMedium=100
AceAttackPercentHard=100
