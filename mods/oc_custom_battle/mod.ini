; Over-custom (OC) six-stat enhancement, battle server side. Applies the stat
; deltas carried in each owned-unit record to the battle unit after the native
; per-form stat builder. The World Mod oc_custom_server writes those deltas in
; its "oc" mode; in "current" mode records carry nothing and this Mod is idle.
; In "room" mode the records keep their custom skills and the room decides:
; pilots of a room whose title has the !oc command get the deltas and play
; without their custom skills (cleared from the battle unit, never from the
; record); other rooms stay native.
; Changes need a battle server restart. Values cannot carry inline comments.

[mod]
distribution=public
id=oc_custom_battle
category=gameplay
feature=over-custom
channel=beta
activation=automatic
name=Over-custom stats (battle server)
version=0.3.1
api=1
dll=oc_custom_battle.dll
order=112
enabled=1
hosts=BattleServer-548A891D-0046C000
requires=oc_custom.battle_set_unit_stat,oc_custom.battle_weapon_lookup,oc_custom.battle_grade_caps,battle.build_human_unit,battle.lobby_proc,battle.lobby_map_find,battle.lobby_room,battle.lobby_release

[settings]
Enabled=1
; 1 logs every applied allocation with the resulting HP/attack/defense/special.
LogApply=1
