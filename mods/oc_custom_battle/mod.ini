; Over-custom (OC) six-stat enhancement, battle server side. Applies the stat
; deltas carried in each owned-unit record to the battle unit after the native
; per-form stat builder. The World Mod oc_custom_server writes those deltas in
; its "oc" mode; in "current" mode records carry nothing and this Mod is idle.
; Changes need a battle server restart. Values cannot carry inline comments.

[mod]
distribution=public
id=oc_custom_battle
category=gameplay
feature=over-custom
channel=beta
activation=automatic
name=Over-custom stats (battle server)
version=0.1.0
api=1
dll=oc_custom_battle.dll
order=112
enabled=1
hosts=BattleServer-548A891D-0046C000
requires=oc_custom.battle_set_unit_stat,oc_custom.battle_weapon_lookup,oc_custom.battle_grade_caps

[settings]
Enabled=1
; 1 logs every applied allocation with the resulting HP/attack/defense/special.
LogApply=1
