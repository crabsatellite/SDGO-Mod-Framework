; Use config.xml for the render cap; keep native gameplay at 60 Hz.
[mod]
distribution=public
id=fps_limit
name=Configured FPS limit
version=1.0.4
api=1
dll=fps_limit.dll
category=gameplay
feature=fps-limit
channel=stable
activation=manual
order=40
enabled=1
hosts=GOnline-54BE1568-00C97000
requires=fps.config.force60,fps.app.idle,fps.app.render_sync,fps.app.render_backlog,fps.device.present

; The only FPS setting is Framework/Timer@updatefps in the client config.xml.
; It is managed by SDGO Mod Manager. Valid range: 1..1000, fallback: 60.

[settings]
; Developer diagnostics: actual successful Present rate, sampled every 5 seconds.
LogFps=0
