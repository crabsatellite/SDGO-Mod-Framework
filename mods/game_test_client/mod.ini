[settings]
; Opt-in packet diagnostics. Leave off when login recovery owns this entry.
LogNativePacketIngress=0
; Passive per-bot target, movement and free neutral idle observations.
BattleAiActivity=0
; Passive 1 Hz counters for performance comparisons, without activity assertions.
BattleAiPerformance=0
; Opt-in passive observations for special victims, defensive fire and pursuit.
BattleAiBehavior=0
; Opt-in exact native killer/victim and map-damage packet observations.
BattleAiDeaths=0
; Require native TAB life values and a real life decrease in death-match modes.
BattleAiLives=0
; Require a genuine registered AI teleport with preserved HP and changed position.
; Requires BattleAiDeaths=1 and a native Hard PvP battle.
BattleAiTeleport=0
; Opt-in mapped native forward and primary-fire input in a released PvP or
; mission AI battle. Mission use is bound to the observed exact generation,
; room, authenticated pilot and genuine local player-control flag.
BattlePlayerCombat=0
; Opt-in mapped secondary action supplied to its original native consumer.
BattlePlayerSecondary=0
; Keep mapped primary fire held after the initial 180 ms movement, until the
; genuine player-control gate closes. Native ammo, cooldown and FSM remain authoritative.
BattlePlayerCombatContinuous=0
; -1 keeps the current weapon. 0..2 request an actual ordinary ranged slot,
; wait for its native binding, and require real ammunition consumption.
BattlePlayerWeaponSlot=-1
; Opt-in special attack, with BattlePlayerCombat=1 and BattlePlayerWeaponSlot=-1.
; A declared test fixture: once an enemy AI is within the special weapon's range
; the local SP gauge is filled to 30000 (the Battle host needs the matching
; development-only server fixture), mapped action 17 selects the special slot
; and the bound special is fired until the OC client records the local special
; computation. HP, FSM state and weapon data stay native.
BattlePlayerSpecial=0
; Native map number (e.g. 1 for Africa desert); zero keeps quick-room random selection.
BattleMap=0
; Opt-in review camera for recorded footage: the native tracking camera follows one AI
; unit at a time instead of the idle test pilot. Not an assertion.
BattleReviewCamera=0
; Seconds the review camera stays on one AI unit before moving to the next (1..120).
BattleReviewCameraSeconds=6
; Opt-in only in a copied and hash-bound GameTest observer.
ApsalusRoundtrip=0
; Derive and verify both directions from the selected unit's native records.
UnitTransformRoundtrip=0
; Bounded record-derived path; permits one-way entries and more than two forms.
UnitDirectedTransforms=0
UnitTransformSteps=3

; Opt-in imported-unit model, icon and acquisition checks.
CaptureNativeFrames=0
UnitPresentations=0
UnitPresentationDetailOnly=0
UnitPresentationTarget=0
; Bounded encyclopedia/acquisition scope; set only by the sealed runner API.
UnitPagesOnly=0
; Development-only sealed loading-race target: off, catalog, capsule or room.
; The runner writes this from inputs/unit-scenario.json; manual activation is
; rejected by the client plan validator.
EarlyNavigationTarget=off
UnitPortraits=0
CollectionPreviewOnly=0
; Explicit negative collection test. 0 requires successful draw/claim; 6006
; requires a real exhausted-quota reply and proves that no prize is delivered.
CollectionExpectedStatus=0
UnitAcquisitionKind=0
UnitAcquisitionMachine=0
UnitAcquisitionUnit=0
; Sealed read-only acquisition UI scope; skips catalog and encyclopedia cases.
UnitAcquisitionUiPreviewOnly=0
BlueprintMaterialCount=0
BlueprintSynthesize=0
BlueprintOutputUnit=0
NativeIdProbeCount=0
NativeIdProbeChunks=0
NativeIdProbeWitness=0
NativeIdProbeRequireAbsent=0
NativeIdProbeChunk0=
NativeIdProbeChunk1=
NativeIdProbeChunk2=
NativeIdProbeChunk3=
NativeIdProbeChunk4=
NativeIdProbeChunk5=
NativeIdProbeChunk6=
NativeIdProbeChunk7=
NativeIdProbeChunk8=
NativeIdProbeChunk9=
NativeIdProbeChunk10=
NativeIdProbeChunk11=
NativeRecordLifecycleCount=0
NativeRecordLifecycleIds=

LoginShowcaseTest=0
LoginShowcaseExpectedUnit=0
LoginShowcaseGradeMask=0
BoundaryContactReview=0
