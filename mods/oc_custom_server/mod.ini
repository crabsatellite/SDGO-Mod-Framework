; Over-custom (OC) six-stat enhancement, World server side. Keeps the original
; OC rules (normal points by level, over points through the OC challenge,
; per-unit growth rows, stat caps) in the Mod's own tables and procedures in
; the game database; the current custom-parts data is never written.
; Mode=current keeps every record native (OC data stays stored, inactive).
; Mode=oc writes each owned unit's OC stat deltas into the records the World
; server sends and blanks the four custom-skill slots in those records, so one
; rule set is active at a time. Lobby requests need friend_unit_gift_server.
; Changes need a World server restart. Values cannot carry inline comments.

[mod]
distribution=public
id=oc_custom_server
category=gameplay
feature=over-custom
channel=beta
activation=automatic
name=Over-custom stats (World server)
version=0.1.0
api=1
dll=oc_custom_server.dll
order=36
enabled=1
hosts=WorldServer-548A86E3-0010C000
files=oc_schema.sql,oc_unit_rev.tsv
requires=oc_custom.world_send,oc_custom.world_req_unit_slot_page,oc_custom.world_req_active_wait_unit,oc_custom.world_req_get_user_unit_info,oc_custom.world_req_user_info,oc_custom.world_req_battle_end_user

[settings]
Enabled=0
Mode=current
; 1 logs the first filled record batches after start (diagnostic).
LogFill=1
; Item granted by a successful OC challenge (original reward item).
RewardItem=3240013
