[map_catalog.set_terrain_rect]
kind=code
rva=0x002704A0
expect=55 8B EC F3 0F 10 45 08 F3 0F 11 81 48 31 00 00 F3 0F 10 45 0C F3 0F 11

[map_catalog.set_terrain_rect_enabled]
kind=code
rva=0x002704E0
expect=55 8B EC 8A 45 08 88 81 58 31 00 00 5D C2 04 00

; Authoritative boundary notices use the native CUnit HP setter. The function
; only writes CUnit+0x38; server admission and the nonlethal floor stay authoritative.
[map_catalog.set_hp]
kind=code
rva=0x0025E790
expect=55 8B EC 8B 45 08 89 41 38 5D C2 04 00
