; Imported map catalog hooks, verified against:
; GOnline.exe SHA256 e2dba73c10302b50cb0e6f2e58dd0a14effa8d224989ae570a7f8e05af79ff92
[host]
image=GOnline.exe
timestamp=0x54BE1568
size_of_image=0x00C97000

; Native 844-byte/type-0x0F GDT loader. CGridDataMgr::LoadAllData calls it once,
; for gdrs\0254.gdt (the map table), before any map list or room UI exists.
[map_catalog.load_map_table]
kind=code
rva=0x00019A50
expect=55 8B EC 6A FF 68 2E 78 D9 00 64 A1 00 00 00 00 50 83 EC 68 A1 10 71 FF

; Derived-data builder called once by LoadAllData after the final table
; (0280.gdt). Mission records are inserted before it runs.
[map_catalog.tables_ready]
kind=code
rva=0x000834D0
expect=E8 4B 9B FE FF E8 F6 28 FF FF E9 11 B8 FF FF

; Mission script dispatcher: cdecl (const char* name, CMissionMode* mode) looks up
; a global Lua function by exact name and calls it. Every mission script use
; (opening, cutscenes, phase events, skip) goes through it, so imported mission
; scripts are loaded into the running VM right before its first call.
[map_catalog.mission_call]
kind=code
rva=0x006CC5E0
expect=55 8B EC 56 57 6A 00 E8 D4 B8 FC FF 6A 00 8B F0

; Battle HUD setup, room path: after BattleOperator it compares the room mode (eax, from room
; data ecx+0x66) with 8 and 10 to create the OriginalModeOperator speech UI. Site = mov edx, 8.
[map_catalog.operator_mode]
kind=site
rva=0x000BB7A9
expect=BA 08 00 00 00 66 3B D0 75 22

; Battle loading screen: after loading the room data (eax), compares the room mode (ecx, from
; room data +0x66) with 8 to use the mission catalogue poster (+1209). Site = mov edx, 8.
[map_catalog.loading_mode]
kind=site
rva=0x000AB5B4
expect=BA 08 00 00 00 66 3B D1 0F 85 6B 01 00 00

; NTF_CREATE_NPC: eax = room mode, ecx = room data, esi = packet.
; The native OriginalModeOperator consumes the NPC's dialogue and unit sprite.
[map_catalog.npc_operator_mode]
kind=site
rva=0x000D6B8E
expect=BF 08 00 00 00 66 3B F8 74 0E

; Native mission presentation service. Message 0x4272 starts the sector-clear
; banner and fade; other message codes include start/failure/completion.
; The inherited handler performs no work for 0x4272 and returns 1.
[map_catalog.mission_message]
kind=code
rva=0x000B5210
expect=55 8B EC 6A FF 68 C8 C4 D9 00 64 A1 00 00 00 00 50 83 EC 58 A1 10 71 FF


; CMissionMode::Update implementation. mission_ai owns the vtable slot; this
; independent code hook runs after that owner calls the original implementation.
[map_catalog.mission_update]
kind=code
rva=0x006D38B0
expect=55 8B EC 6A FF 68 2B 73 E0 00 64 A1 00 00 00 00 50 81 EC 04 01 00 00 A1

