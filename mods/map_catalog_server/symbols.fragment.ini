; Mission phase success has already sent the native 0x0905 clear/removal packet
; and computed the stock transition deadline (now + 2) in EDX. The following
; instruction starts the two native deadline stores. Hooking here leaves the
; final-stage and event-next control flow owned by the original server.
[map_catalog_server.phase_success_deadline]
kind=site
rva=0x0008AA3E
expect=8B 45 98 89 90 B0 16 03 00 8B 4D 98 8B 55 98 8B 82 B0 16 03 00

; Ordinary map-death requests keep their native path. Fixed-size marked contact
; extensions are consumed before native target admission and only apply the
; declared nonlethal environment policy for an authenticated room participant.
[map_catalog_server.map_contact_request]
kind=code
rva=0x000D1DD0
; A1's four-byte security-cookie address is an IMAGE_REL_BASED_HIGHLOW operand.
; Keep the instruction/stack contract fixed while allowing native ASLR relocation.
expect=55 8B EC 81 EC C0 00 00 00 A1 ?? ?? ?? ?? 33 C5 89 45 D0
