; Over-custom (OC) six-stat enhancement, client side. Puts the OC-era OC tab
; back into the factory and fills its page with the original OC layouts of
; the client package (uirs\0800 level track and ITEM box with the items' 3D
; models, uirs\0794 allocation window with the six-dimension chart, uirs\0813
; challenge window, uirs\0819 confirmation) for the active unit: normal and
; Over points, the OC challenge and reset. In battle the local unit receives the
; OC speed and agility gains. Requests ride the friend-gift carrier
; (friend_unit_gift_client must be enabled) and the server must run
; oc_custom_server in its "oc" mode. Values cannot carry inline comments.

[mod]
distribution=public
id=oc_custom_client
category=gameplay
feature=over-custom
channel=beta
activation=automatic
name=Over-custom stats (client)
version=0.3.1
api=1
dll=oc_custom_client.dll
order=170
enabled=1
hosts=GOnline-54BE1568-00C97000
requires=oc_custom.client_upgrade_init,oc_custom.client_renderer,oc_custom.client_header_update,oc_custom.client_factory_update,oc_custom.client_factory_vtable,oc_custom.client_header_vtable,oc_custom.client_upgrade_callback,oc_custom.client_upgrade_update,oc_custom.client_upgrade_vtable,hangar.ui_add_button,hangar.ui_find_control,hangar.ui_text_item,hangar.ui_add_skin,hangar.ui_button_vtable,friend_unit_gift.ui_add_icon,storage.session,net.send_packet,hangar.profile_global,oc_custom.grid_singleton,game.unit_manager,oc_custom.client_unit_derive_call,oc_custom.client_add_player,oc_custom.client_unit_derive,oc_custom.client_tab_menu_update,oc_custom.client_tab_menu_callback,oc_custom.client_tab_menu_vtable,friend_unit_gift.ui_refresh_geometry,oc_custom.client_inventory_update,oc_custom.client_inventory_vtable,oc_custom.client_render_lock,oc_custom.client_render_clear,oc_custom.client_render_load,oc_custom.client_render_rotation,oc_custom.client_render_model,oc_custom.client_model_animation,oc_custom.client_render_unlock

[settings]
Enabled=1
; Add the OC speed and agility gains to the local unit in battle.
BattleMobility=1
