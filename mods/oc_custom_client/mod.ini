; Over-custom (OC) six-stat enhancement, client side. Drives the original OC
; windows of the client package (uirs94/0813/0819.uir) and the OVER CUSTOM
; entry on the factory upgrade page for the active unit: normal and Over
; points, the OC challenge and reset. In battle the local unit receives the OC
; speed and agility gains. Requests ride the friend-gift carrier
; (friend_unit_gift_client must be enabled) and the server must run
; oc_custom_server in its "oc" mode. Values cannot carry inline comments.

[mod]
distribution=public
id=oc_custom_client
category=gameplay
feature=over-custom
channel=beta
activation=automatic
name=Over-custom stats (client)
version=0.2.0
api=1
dll=oc_custom_client.dll
order=170
enabled=1
hosts=GOnline-54BE1568-00C97000
requires=oc_custom.client_upgrade_init,oc_custom.client_upgrade_callback,oc_custom.client_upgrade_update,oc_custom.client_upgrade_vtable,hangar.ui_add_button,hangar.ui_find_control,hangar.ui_text_item,hangar.ui_add_skin,hangar.ui_button_vtable,friend_unit_gift.ui_add_icon,storage.session,net.send_packet,hangar.profile_global,oc_custom.grid_singleton,game.unit_manager,oc_custom.client_unit_derive_call,oc_custom.client_add_player,oc_custom.client_unit_derive

[settings]
Enabled=1
; Add the OC speed and agility gains to the local unit in battle.
BattleMobility=1
