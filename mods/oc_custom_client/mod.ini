; Over-custom (OC) six-stat enhancement, client side. Adds an OC allocation
; panel to the native factory upgrade page for the active unit: normal points,
; Over points, OC challenge and reset. Requests ride the friend-gift carrier
; (friend_unit_gift_client must be enabled) and the server must run
; oc_custom_server in its "oc" mode. Values cannot carry inline comments.

[mod]
distribution=public
id=oc_custom_client
category=gameplay
feature=over-custom
channel=beta
activation=automatic
name=Over-custom stats (client)
version=0.1.0
api=1
dll=oc_custom_client.dll
order=170
enabled=1
hosts=GOnline-54BE1568-00C97000
requires=oc_custom.client_upgrade_init,oc_custom.client_upgrade_callback,oc_custom.client_upgrade_update,oc_custom.client_upgrade_vtable,hangar.ui_add_button,hangar.ui_find_control,hangar.ui_text_item,hangar.ui_add_skin,hangar.ui_button_vtable,friend_unit_gift.ui_add_empty_skin,friend_unit_gift.ui_add_icon,storage.session,net.send_packet,hangar.profile_global

[settings]
Enabled=1
; Top-left of the OC toggle row and overlay inside the factory upgrade page
; column (pixels). The overlay is 271x324.
PanelLeft=4
PanelTop=172
