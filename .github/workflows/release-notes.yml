name: Bilingual release notes and demonstrations
on:
  push:
    branches: [master]
    paths: ['docs/**', 'tools/release_notes.py', 'tools/game_test_release_demo.py', 'tests/test_release_notes.py', '.github/workflows/*release*.yml']
  pull_request:
    paths: ['docs/**', 'tools/release_notes.py', 'tools/game_test_release_demo.py', 'tests/test_release_notes.py', '.github/workflows/*release*.yml']
permissions:
  contents: read
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_release_notes
