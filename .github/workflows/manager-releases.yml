name: Manager release updates
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manager-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r manager/requirements-build.txt
      - name: Choose release channel
        shell: pwsh
        run: |
          $prepareOnly='${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.ref_name }}' -ne 'master' -and '${{ github.ref_type }}' -ne 'tag'
          if ($prepareOnly) {
            $version=(Get-Content VERSION -TotalCount 1).Trim()
            $channel=if($version -match '-beta\.'){'beta'}else{'stable'}
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $version='${{ github.ref_name }}'.Substring(1)
            $channel=if($version -match '-beta\.'){'beta'}else{'stable'}
          } else {
            $version=(Get-Content VERSION -TotalCount 1).Trim()+'-beta.${{ github.run_number }}${{ github.run_attempt }}'
            $channel='beta'
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_CHANNEL=$channel" >> $env:GITHUB_ENV
          "PREPARE_ONLY=$($prepareOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
      - name: Reject local-only source from public publication
        run: python tools/distribution_guard.py --git-tree $env:GITHUB_SHA
      - name: Reject local-only bytes in every newly published commit
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python tools/distribution_guard.py --git-range "$env:BEFORE..$env:AFTER"
      - name: Update integrity and install regression
        timeout-minutes: 3
        run: python -m unittest discover -s tests -p "test_manager_updates*.py" -v
      - name: Native path picker
        timeout-minutes: 3
        run: python -m unittest discover -s tests -p "test_manager_picker.py" -v
      - name: Owner shortcut serialization
        timeout-minutes: 3
        run: python -m unittest discover -s tests -p "test_mod_manager_entrypoints.py" -v
      - name: Announcement rules and sealed native inputs
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_announcements.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_announcement_news*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_game_test_atomic_write.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_game_test_runtime_outputs.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Random overlay release metadata
        timeout-minutes: 3
        run: python -m unittest discover -s tests -p "test_room_random_package.py" -v
      - name: Calendar gifts and existing-policy upgrades
        timeout-minutes: 3
        run: python -m unittest discover -s tests -p "test_calendar*.py" -v
      - name: Build and validate exact release bytes
        run: python tools/build_release.py --build --channel $env:RELEASE_CHANNEL --version $env:RELEASE_VERSION
      - name: Mission profile configuration and native contracts
        shell: pwsh
        run: |
          python -m unittest tests.test_mission_behavior_profile_codec tests.test_mission_behavior_manager tests.test_game_test_mission_behavior_plan tests.test_game_test_server_report -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --target mission_behavior_client_policy_test mission_behavior_client_runtime_test mission_behavior_server_test --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release -R '^mission_behavior_' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Standalone Manager check
        run: python tests/mod_manager_frozen_test.py --exe "build/manager/SDGO Mod Manager.exe"
      - name: Owner publication and player update contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_owner_owned_process.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_owner_update_chain.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_owner_update_transport.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/owner_updates_frozen_test.py --exe "build/manager/SDGO Mod Manager.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native login recovery policy
        shell: pwsh
        run: |
          cmake --build build --config Release --target login_recovery_policy_test
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          ctest --test-dir build -C Release -R '^login_recovery_policy$' --output-on-failure
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Native client data guards
        shell: pwsh
        run: |
          cmake --build build --config Release --target native_data_guard_runtime_test game_test_quiet_wait_room_test lobby_music_fix_dll_test
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          ctest --test-dir build -C Release -R '^(native_data_guard_actual_dll|game_test_quiet_wait_room_offline|lobby_music_fix_actual_dll|lobby_music_fix_missing_file)$' --output-on-failure
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Retain prepared package
        # Candidate branches build exact install bytes before runtime delivery.
        if: env.PREPARE_ONLY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prepared-manager-release
          path: |
            dist/SDGO-ModFramework-*.zip
            dist/SDGO-ModFramework-*.sha256
          retention-days: 3
          if-no-files-found: error
      - name: Native announcement policy
        shell: pwsh
        run: |
          cmake --build build --config Release --target announcement_policy_test announcement_window_messages_test announcement_news_test --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/Release/announcement_policy_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/Release/announcement_window_messages_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/Release/announcement_news_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish immutable versioned asset
        if: env.PREPARE_ONLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag='v'+$env:RELEASE_VERSION
          if (gh release view $tag --json tagName 2>$null) { exit 0 }
          $options=@('--target','${{ github.sha }}','--title',('SDGO Mod Manager '+$env:RELEASE_VERSION),'--generate-notes')
          if($env:RELEASE_CHANNEL -eq 'beta'){$options+=@('--prerelease','--latest=false')}else{$options+='--latest'}
          gh release create $tag "dist/SDGO-ModFramework-$env:RELEASE_VERSION.zip" "dist/SDGO-ModFramework-$env:RELEASE_VERSION.sha256" @options
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
